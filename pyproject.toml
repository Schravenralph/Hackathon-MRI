[project]
name = "hackathon-mri"
version = "0.1.0"
description = "MRI Harmonization & Uncertainty Visualization Platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlmodel>=0.0.22",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "pydantic-settings>=2.6.0",
    "torch>=2.5.0",
    "torchvision>=0.20.0",
    "pillow>=11.0.0",
    "numpy>=2.1.0",
    "scikit-image>=0.24.0",
    "scikit-learn>=1.5.0",
    "simpleitk>=2.4.0",
    "nibabel>=5.3.0",
    "matplotlib>=3.9.0",
    "grad-cam>=1.5.4",
    "aiofiles>=24.1.0",
    "kaggle>=2.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "cancer_detection", "harmonization", "uncertainty"]

[tool.pytest.ini_options]
testpaths = ["tests"]
